version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jis
      POSTGRES_PASSWORD: jis
      POSTGRES_DB: jis
    ports:
      - "55433:5432"  # avoid clashing with host Postgres
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "36381:6379"  # avoid clashing with host Redis
    restart: unless-stopped

  router:
    build:
      context: ./router
    environment:
      JIS_SHARED_SECRET: denDolder_2024!
      JWT_SECRET: ""  # optional; when set, Authorization: Bearer <jwt> is required (HS256)
      JWT_AUDIENCE: ""
      JWT_ISSUER: ""
      JIS_PORT: "8081"
      PGHOST: db
      PGUSER: jis
      PGPASSWORD: jis
      PGDATABASE: jis
      PGPORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      ALLOWED_INTENTS: ""
      ALLOWED_ROLES: ""
      RATE_LIMIT: "60"
      RATE_WINDOW: "60"
      TLS_CERT_FILE: ""
      TLS_KEY_FILE: ""
      TLS_CA_FILE: ""
      TLS_REQUIRE_CLIENT_CERT: "false"
    ports:
      - "18081:8081"  # avoid clashing with host 8081
    depends_on:
      - db
      - redis
    restart: unless-stopped

  ws-bridge:
    build:
      context: ./ws-bridge
    environment:
      WS_PORT: "9000"
      ROUTER_BASE: "http://router:8081"
      JIS_SHARED_SECRET: denDolder_2024!
      JWT_TOKEN: ""
    ports:
      - "9000:9000"
    depends_on:
      - router
    restart: unless-stopped

  mqtt:
    image: eclipse-mosquitto:2
    ports:
      - "31883:1883"  # host port for MQTT
    restart: unless-stopped

  mqtt-bridge:
    build:
      context: ./mqtt-bridge
    environment:
      MQTT_HOST: mqtt
      MQTT_PORT: "1883"
      MQTT_IN_TOPIC: "jis/in"
      MQTT_OUT_TOPIC: "jis/out"
      ROUTER_BASE: "http://router:8081"
      JIS_SHARED_SECRET: denDolder_2024!
      JWT_TOKEN: ""
    depends_on:
      - router
      - mqtt
    restart: unless-stopped
